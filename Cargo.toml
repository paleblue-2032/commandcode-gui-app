[package]
name = "commandcode-gui-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
agent-client-protocol = { version = "5.2", features = ["process"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "6"
eframe = { version = "0.37", default-features = false, features = [
    "clipboard",
    "default_fonts",
    "links",
    "system_fonts",
    "wayland",
    "wgpu",
    "x11",
] }
egui = "0.37"
egui-file-dialog = "0.16"
egui_commonmark = { version = "0.26", default-features = false, features = [
    "better_syntax_highlighting",
    "load-images",
    "pulldown_cmark",
] }
open = "5"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
